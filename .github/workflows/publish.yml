name: publish

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ty check
      - run: uv run pytest -q

  pypi:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Check the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package_version="$(uv version --short)"
          if [ "$tag" != "$package_version" ]; then
            echo "Tag $tag does not match pyproject version $package_version" >&2
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
